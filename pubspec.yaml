name: ble_robot_controller
description: Bluetooth Robot Controller with D-pad and dual arm joysticks.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Maintained fork of flutter_bluetooth_serial compatible with current Flutter/AGP
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
